name: Build Tag

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build Containers
    if: github.repository == 'xibosignage/xibo-xmr'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Build X
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        run: |
          ARCH=${{ matrix.platform }}
          echo "arch_tag=${{ github.ref_name }}-${ARCH##*/}" >> $GITHUB_ENV

      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}:${{ env.arch_tag }}
          build-args: GIT_COMMIT=${{ github.sha }}
          push: true
          load: false

  release:
    name: Merge and Release
    if: github.repository == 'xibosignage/xibo-xmr'
    needs: build
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}:${GITHUB_REF##*/} \
            ghcr.io/${{ github.repository }}:${GITHUB_REF##*/}-amd64 \
            ghcr.io/${{ github.repository }}:${GITHUB_REF##*/}-arm64

      - name: Pull Image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${GITHUB_REF##*/}

      - name: Build archive
        run: |
          CONTAINER=$(docker create ghcr.io/${{ github.repository }}:${GITHUB_REF##*/})
          echo 'Copying PHAR from container.'
          docker cp "$CONTAINER":/opt/xmr/bin/xmr.phar bin/xmr.phar
          docker rm "$CONTAINER"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            bin/xmr.phar
